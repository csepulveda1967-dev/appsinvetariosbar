<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingreso — Módulo de Barra</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #eaf4fb;
  --card: #ffffff;
  --text: #0f172a;
  --muted: #64748b;
  --primary: #1b4f72;
  --accent: #2980b9;
  --border: #cce3f0;
  --danger: #dc2626;
}
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  min-height: 100vh;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

.back-link {
  position: absolute;
  top: 20px;
  left: 20px;
  font-size: 13px;
  color: var(--primary);
  text-decoration: none;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 5px;
}
.back-link:hover { text-decoration: underline; }

.login-card {
  background: var(--card);
  border: 1.5px solid var(--border);
  border-top: 5px solid var(--primary);
  border-radius: 18px;
  box-shadow: 0 12px 36px rgba(27,79,114,0.12);
  width: 100%;
  max-width: 420px;
  padding: 36px 30px;
}

.card-header {
  text-align: center;
  margin-bottom: 28px;
}
.card-header .icon {
  font-size: 40px;
  display: block;
  margin-bottom: 10px;
}
.card-header h1 {
  font-size: 20px;
  font-weight: 800;
  color: var(--primary);
  letter-spacing: -.02em;
  margin-bottom: 5px;
}
.card-header p {
  font-size: 13px;
  color: var(--muted);
}

.module-badge {
  display: flex;
  align-items: center;
  gap: 8px;
  background: #eaf4fb;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 14px;
  margin-bottom: 22px;
  font-size: 12px;
  color: var(--primary);
}
.module-badge strong { font-weight: 700; }

label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: #334155;
  margin-bottom: 6px;
  margin-top: 14px;
}
input {
  width: 100%;
  padding: 11px 13px;
  border: 1.5px solid var(--border);
  border-radius: 9px;
  font-size: 14px;
  background: #fdfdfd;
  color: var(--text);
  transition: border-color .15s;
}
input:focus {
  outline: none;
  border-color: var(--accent);
  background: white;
}

#errorMsg {
  background: #fef2f2;
  border: 1px solid #fecaca;
  color: var(--danger);
  padding: 10px 12px;
  border-radius: 8px;
  font-size: 12px;
  margin-top: 12px;
  display: none;
}

.btn-submit {
  margin-top: 22px;
  width: 100%;
  background: var(--primary);
  color: white;
  border: none;
  border-radius: 10px;
  padding: 13px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: background .15s;
  letter-spacing: -.01em;
}
.btn-submit:hover { background: var(--accent); }
.btn-submit:disabled { opacity: .6; cursor: default; }

.quick-hint {
  text-align: center;
  font-size: 11px;
  color: var(--muted);
  margin-top: 16px;
}
</style>
</head>
<body>

<a class="back-link" href="index.html">← Portal principal</a>

<div class="login-card">
  <div class="card-header">
    <span class="icon">🍸</span>
    <h1>Módulo de Barra</h1>
    <p>Ingreso para encargados de turno y bartenders</p>
  </div>

  <div class="module-badge">
    <span>🔑</span>
    <span><strong>Rol:</strong> Operación — Apertura, cierre de turno, pedidos y recepción de mercadería.</span>
  </div>

  <form id="loginForm" onsubmit="iniciarSesion(event)">
    <label for="email">Correo electrónico</label>
    <input type="email" id="email" required placeholder="tu-correo@dominio.com" autocomplete="username">

    <label for="password">Contraseña</label>
    <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">

    <div id="errorMsg"></div>

    <button type="submit" class="btn-submit" id="btnSubmit">
      Ingresar a Barra →
    </button>
  </form>

  <p class="quick-hint">¿Eres administrador? <a href="login_admin.html" style="color:#1b4f72; font-weight:600;">Accede al Panel Gerencial</a></p>
</div>

<script>
async function iniciarSesion(e) {
  e.preventDefault();
  const email    = document.getElementById('email').value.trim().toLowerCase();
  const password = document.getElementById('password').value;
  const errorBox = document.getElementById('errorMsg');
  const btn      = document.getElementById('btnSubmit');

  errorBox.style.display = 'none';
  btn.textContent = 'Verificando...';
  btn.disabled = true;

  const sbUrl = localStorage.getItem('supabaseUrl');
  const sbKey = localStorage.getItem('supabaseKey');

  try {
    // ── Autenticación Supabase (si está configurado) ──────────
    if (sbUrl && sbKey) {
      const supabase = window.supabase.createClient(sbUrl, sbKey);
      const { error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) throw error;
    }

    // ── Verificar que el rol sea de Barra ─────────────────────
    // Admin no puede entrar por esta puerta
    if (email === 'asesorconsultorcasf@yahoo.com') {
      throw new Error('Este correo es de administración. Accede por el Panel Gerencial.');
    }

    // Guardar sesión y redirigir al módulo de barra
    sessionStorage.setItem('usuarioEmail', email);
    sessionStorage.setItem('usuarioRol', 'BAR');
    sessionStorage.removeItem('sesionGerente');
    window.location.href = 'app_operacion_bar.html';

  } catch (err) {
    errorBox.textContent = err.message || 'Error al autenticar. Verifica tus credenciales.';
    errorBox.style.display = 'block';
    btn.textContent = 'Ingresar a Barra →';
    btn.disabled = false;
  }
}
</script>
</body>
</html>
